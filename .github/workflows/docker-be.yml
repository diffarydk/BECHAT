name: Build and Push Backend Docker Image

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'app/**'
      - 'Dockerfile'
      - 'requirements.txt'
      - '.github/workflows/docker-be.yml'
  workflow_dispatch:

jobs:
  build-and-push:
    name: Build & Push BE Image
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout codebase
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Set up Docker Buildx (for advanced caching and multi-platform build support)
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 3. Configure AWS credentials
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      # 4. Log in to Amazon ECR
      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # 5. Build and push the Docker image to Amazon ECR
      - name: Build and Push Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            058264530865.dkr.ecr.us-east-1.amazonaws.com/fechat-be:latest
            058264530865.dkr.ecr.us-east-1.amazonaws.com/fechat-be:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
