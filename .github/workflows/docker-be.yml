name: Build and Push Backend Docker Image

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'app/**'
      - 'Dockerfile'
      - 'requirements.txt'
      - '.github/workflows/docker-be.yml'
  workflow_dispatch:

jobs:
  build-and-push:
    name: Build & Push BE Image
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout codebase
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Set up Docker Buildx (for advanced caching and multi-platform build support)
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 3. Log in to Docker Hub
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 4. Build and push the Docker image
      - name: Build and Push Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/fechat-be:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/fechat-be:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
